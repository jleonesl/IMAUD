name: Deploy SITMAUD institutional preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble public site (exclude demo and internal files)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          for file in index.html funcionario.html contribuyente-v2.html contribuyente-cuenta.html activar-contribuyente.html verificar-solvencia.html \
            styles.css auth.css billing.css territorial-map.css citizen-dashboard.css \
            auth.js official-finance.js official-payment-registration.js pos-terminals.js solvency-documents.js \
            condominium-assessments.js municipal-bank-admin.js official-receipt-template.js citizen-receipts.js citizen-payment-registration.js citizen-dashboard.js app.js territorial-map.js contributor-documents.js; do
            test -f "$file"
            cp "$file" dist/"$file"
          done
          cp -R assets/. dist/assets/
          if grep -RlE 'href="./contribuyente-demo.html"|src="billing.js|src="reports.js|src="treasury-validation.js' dist --include='*.html'; then
            echo "Forbidden demo link or script in public HTML" >&2
            exit 1
          fi
          echo "Verify local application dependencies"
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path("dist")
          html = (root / "index.html").read_text(encoding="utf-8")
          for attr in ("src", "href"):
              for value in re.findall(rf'{attr}="([^"]+)"', html):
                  if value.startswith(("https://", "http://", "#", "mailto:")):
                      continue
                  path = value.split("?", 1)[0]
                  if path and not (root / path).is_file():
                      raise SystemExit(f"Missing published asset: {path}")
          if "leaflet@1.9.4/dist/leaflet.js" not in html or "leaflet@1.9.4/dist/leaflet.css" not in html:
              raise SystemExit("Leaflet dependencies are not declared for the territorial map.")
          print("All local assets and map dependencies are present.")
          PY
          node --test tests/citizen-portal.test.mjs
          node --test tests/release-safety.test.mjs
          node --test tests/staff-profiles.test.mjs
          node --test tests/payments-layout.test.mjs
          node --test tests/billing-engine-regression.test.mjs
          node --check dist/official-finance.js
          node --check dist/official-payment-registration.js
          node --check dist/pos-terminals.js
          node --check dist/solvency-documents.js
          node --check dist/condominium-assessments.js
          node --check dist/municipal-bank-admin.js
          node --check dist/citizen-dashboard.js
          node --check dist/citizen-payment-registration.js
          node --check dist/official-receipt-template.js
          node --check dist/citizen-receipts.js
          node --check dist/app.js
          node --check dist/territorial-map.js
          node --check dist/auth.js
          echo "Public site contains only approved website assets; no migrations, archives or demo pages."
      - name: Check public package for server secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RinE '(SUPABASE_SERVICE_ROLE_KEY|sb_secret_|postgres(ql)?://|PRIVATE_KEY-----)' dist --include='*.html' --include='*.js'; then
            echo "Private credentials must never be published." >&2
            exit 1
          fi
      - name: Package site for external hosting (not deployed yet)
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && zip -q -r ../sitmaud-hosting-ready.zip .)
          unzip -l sitmaud-hosting-ready.zip | grep -q 'index.html'
          unzip -l sitmaud-hosting-ready.zip | grep -q 'contribuyente-cuenta.html'
      - name: Save reviewed hosting package
        uses: actions/upload-artifact@v4
        with:
          name: sitmaud-hosting-ready
          path: sitmaud-hosting-ready.zip
          if-no-files-found: error
          retention-days: 14
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
