name: Validate SITMAUD feature branches

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feature/registro-propietario-territorio"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Check application JavaScript
        run: node --check app.js
